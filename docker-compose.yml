name: atrium
services:
  atrium:
    container_name: atrium
    # built by .github/workflows/deploy.yml on every push to main
    image: ghcr.io/totorios99/atrium:latest
    ports:
      - "3005:3005"
    environment:
      DATABASE_URL: "file:/data/cockpit.db"
      VAULT_ROOT: /vaults
    # Runs as antonio (1000:1000) so milestone toggles can write STATUS.md back
    # to the vault. The pillar vaults are owned 1000:1000; the container image
    # defaults to uid 1001, which cannot write them even without :ro. The
    # cockpit_db volume is chowned to match (see the alpine one-liner in the
    # cockpit note). Next standalone only writes /data and /vaults at runtime.
    user: "1000:1000"
    volumes:
      # SQLite database — persists across container restarts
      - cockpit_db:/data
      # Vault directories — mount your Obsidian vaults here
      - ${HOME}/Documents/The Alchemist's Atrium/cyber-brain:/vaults/cyber-brain
      - ${HOME}/Documents/The Alchemist's Atrium/fitness-brain:/vaults/fitness-brain
      - ${HOME}/Documents/The Alchemist's Atrium/spirituality-brain:/vaults/spirituality-brain
      - ${HOME}/Documents/The Alchemist's Atrium/homelab-brain:/vaults/homelab-brain
      - ${HOME}/Documents/The Alchemist's Atrium/linux-brain:/vaults/linux-brain
      - ${HOME}/Documents/The Alchemist's Atrium/webdev-brain:/vaults/webdev-brain
      - ${HOME}/Documents/The Alchemist's Atrium/travel-brain:/vaults/travel-brain
      - ${HOME}/Documents/The Alchemist's Atrium/coffee-brain:/vaults/coffee-brain
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3005/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      icon: "https://raw.githubusercontent.com/totorios99/atrium/main/public/icon-512.png"

  # polls ghcr.io for a newer image tag and recreates labeled containers —
  # this is the auto-deploy step, no inbound webhook/runner needed

volumes:
  cockpit_db:
    # Keep the original volume: it holds habits, inbox and the cockpit DB.
    name: cockpit_cockpit_db
    external: true

x-casaos:
  architectures: ["amd64", "arm64"]
  main: atrium
  icon: "https://raw.githubusercontent.com/totorios99/atrium/main/public/icon-512.png"
  title:
    en_us: Atrium
  category: Utilities
  description:
    en_us: Personal dashboard reading Obsidian vaults, habits, and weekly checklist.
  port_map: "3005"
