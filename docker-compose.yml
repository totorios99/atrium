services:
  cockpit:
    # built by .github/workflows/deploy.yml on every push to main
    image: ghcr.io/totorios99/dashboard:latest
    ports:
      - "3005:3005"
    environment:
      DATABASE_URL: "file:/data/cockpit.db"
      VAULT_ROOT: /vaults
    # Runs as antonio (1000:1000) so milestone toggles can write STATUS.md back
    # to the vault. The pillar vaults are owned 1000:1000; the container image
    # defaults to uid 1001, which cannot write them even without :ro. The
    # cockpit_db volume is chowned to match (see the alpine one-liner in the
    # cockpit note). Next standalone only writes /data and /vaults at runtime.
    user: "1000:1000"
    volumes:
      # SQLite database — persists across container restarts
      - cockpit_db:/data
      # Vault directories — mount your Obsidian vaults here
      - ${HOME}/Documents/The Alchemist's Atrium/cyber-brain:/vaults/cyber-brain
      - ${HOME}/Documents/The Alchemist's Atrium/fitness-brain:/vaults/fitness-brain
      - ${HOME}/Documents/The Alchemist's Atrium/spirituality-brain:/vaults/spirituality-brain
      - ${HOME}/Documents/The Alchemist's Atrium/homelab-brain:/vaults/homelab-brain
      - ${HOME}/Documents/The Alchemist's Atrium/central-brain:/vaults/central-brain
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3005/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      icon: "https://raw.githubusercontent.com/totorios99/dashboard/main/public/icon-512.png"

  # polls ghcr.io for a newer image tag and recreates labeled containers —
  # this is the auto-deploy step, no inbound webhook/runner needed
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Credenciales de ghcr.io para las imagenes privadas (nido-del-amor).
      # Watchtower hace sus propias llamadas al registry desde dentro del
      # contenedor: el `docker login` del host no le llega solo.
      #
      # Se monta el DIRECTORIO, no el archivo. `docker login` no edita
      # config.json en sitio: escribe un temporal y lo renombra, creando un
      # inodo nuevo. Un bind de archivo fija el inodo viejo y el contenedor
      # se queda mirando credenciales obsoletas para siempre.
      - ${HOME}/.docker:/config:ro
    environment:
      DOCKER_CONFIG: /config
    # Sin --label-enable: vigila TODOS los contenedores en marcha (también las
    # apps de CasaOS). Para excluir uno: label
    # com.centurylinklabs.watchtower.enable=false (p. ej. Frigate, que rompe
    # config entre versiones). Un tag fijado (radarr:6.3.0) no sube de
    # versión, pero linuxserver re-publica el mismo tag con base parcheada,
    # así que también se recrean.
    # --cleanup borra la imagen vieja: el rollback es fijar el tag de la
    # versión anterior en el compose, no hay copia local.
    command: --interval 300 --cleanup
    restart: unless-stopped

volumes:
  cockpit_db:

x-casaos:
  architectures: ["amd64", "arm64"]
  main: cockpit
  icon: "https://raw.githubusercontent.com/totorios99/dashboard/main/public/icon-512.png"
  title:
    en_us: Second Brain Cockpit
  category: Utilities
  description:
    en_us: Personal dashboard reading Obsidian vaults, habits, and weekly checklist.
  port_map: "3005"
